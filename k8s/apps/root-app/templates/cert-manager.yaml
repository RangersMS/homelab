apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.certManager.spec.destination.namespace | default "cert-manager" }}
  labels:
    istio-injection: enabled
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: {{ .Values.certManager.spec.destination.namespace | default "scert-manager" }}
    server: {{ .Values.global.spec.destination.server | default "https://kubernetes.default.svc" }}
  project: {{ .Values.certManager.spec.destination.project | default "default" }}
  source:
    path: k8s/apps/cert-manager
    repoURL: https://github.com/RangersMS/homelab
    targetRevision: {{ .Values.global.spec.source.targetRevision | default "main" }}
    helm:
      valueFiles:
      - values.yaml
      ignoreMissingValueFiles: true
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true
    syncOptions:
      - CreateNamespace=true
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: lets-encrypt
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: lets-encrypt-account-key
    solvers:
    - dns01:
        cloudflare:
          email: invalid@localhost
          apiKeySecretRef:
            name: cloudflare-api-key-secret
            key: api-key

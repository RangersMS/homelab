apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: lets-encrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: lets-encrypt-account-key
    solvers:
    - dns01:
        cloudflare:
          apiKeySecretRef:
            name: cloudflare-api-key-secret
            key: api-key
        selector:
          dnsZones:
            - 'rangers-labs.com'
